[package]
name = "movement-lab"
version = "0.1.0"
edition = "2024"

[features]
default = []
viewer = ["dep:bevy"]

[dependencies]
glam = { version = "0.30", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
bevy = { version = "=0.19.0", default-features = false, features = ["3d", "ui"], optional = true }

[[bin]]
name = "movement-lab"
path = "src/main.rs"
required-features = ["viewer"]

[profile.dev]
opt-level = 1
debug = 0

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1
debug = 0
